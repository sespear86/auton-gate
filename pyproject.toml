[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auton-gate"
version = "0.1.0"
description = "Mechanical Production Readiness Gate for /autonomous runs (implements portions of PRODUCTION_CHECKLIST.md)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Grok Autonomous (ee70444d identification)"}]
license = {text = "MIT"}
dependencies = [
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
auton-gate = "auton_gate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
