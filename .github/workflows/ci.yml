name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -e ".[dev]" || python -m pip install -e .
      - name: Ruff
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Smoke gate (bootstrap)
        run: |
          python -m pip install -e .
          python -m auton_gate.cli check .
